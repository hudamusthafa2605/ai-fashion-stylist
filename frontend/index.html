<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Fashion Stylist</title>

    <style>
        .reset-button {
    grid-column: 1 / 3;
    background: #eee;
    color: #222;
}
        .footer {
    text-align: center;
    margin-top: 60px;
    padding: 25px;
    color: #777;
    font-size: 14px;
}

.footer span {
    margin-left: 5px;
}
#max_price::placeholder {
    color: #888;
}
.reset-button:hover {
    background: #ddd;
}
        .results-title {
    margin-top: 45px;
    margin-bottom: 25px;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
}
        .product-button {
    display: block;
    text-align: center;
    margin-top: 15px;
    padding: 13px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.2s;
}

.product-button:hover {
    background: #000;
    transform: translateY(-2px);
}
.product-button:hover {
    background: #444;
}

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f4f0, #eee9e3);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 38px;
    letter-spacing: -1px;
}

        .subtitle {
    text-align: center;
    color: #666;
    font-size: 17px;
    margin-bottom: 35px;
}

        .form {
    background: white;
    padding: 30px;
    border-radius: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}
        input,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    background: white;
}

        button {
    grid-column: 1 / 3;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    background: #000;
}

        button:hover {
            background: #444;
        }

        #results {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

        .card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.10);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

        .card h3 {
            margin-top: 0;
        }

        .match {
    font-weight: bold;
    margin-top: 15px;
    padding: 8px 12px;
    background: #f2f2f2;
    border-radius: 8px;
    display: inline-block;
}
        .price {
    font-weight: bold;
    font-size: 20px;
    margin: 12px 0;
}
        @media (max-width: 900px) {
    #results {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 700px) {
    .form,
    #results {
        grid-template-columns: 1fr;
    }

    button {
        grid-column: 1;
    }
}
     .product-image {
    width: 100%;
    height: 320px;
    object-fit: contain;
    border-radius: 14px;
    margin-bottom: 15px;
    background: #f8f8f8;
}
    </style>
</head>
<footer class="footer">
    ✨ AI Fashion Stylist
    <span>• Smart outfit recommendations</span>
</footer>
<body>

<div class="container">

    <h1>✨ AI Fashion Stylist</h1>

    <p class="subtitle">
        Find outfits that match your style
    </p>

    <div class="form">

        <select id="gender">
    <option value="">Any Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>

<input id="color" placeholder="Color (e.g. Yellow)">

<select id="occasion">
    <option value="">Any Occasion</option>
    <option value="Casual">Casual</option>
    <option value="Wedding/Formal">Wedding/Formal</option>
    <option value="Other">Other</option>
</select>

<select id="season">
    <option value="">Any Season</option>
    <option value="Spring">Spring</option>
    <option value="Summer">Summer</option>
    <option value="Winter">Winter</option>
</select>

<select id="fit_type">
    <option value="">Any Fit</option>
    <option value="Single Size">Single Size</option>
    <option value="Mixed Range">Mixed Range</option>
    <option value="Range">Range</option>
    <option value="Multi Size">Multi Size</option>
    <option value="Free Size">Free Size</option>
</select>

<select id="fabric">
    <option value="">Any Fabric</option>
    <option value="Cotton">Cotton</option>
    <option value="Silk">Silk</option>
    <option value="Synthetic">Synthetic</option>
    <option value="Georgette">Georgette</option>
    <option value="Net">Net</option>
    <option value="Crepe">Crepe</option>
    <option value="Silk Blend">Silk Blend</option>
    <option value="Traditional Weave">Traditional Weave</option>
    <option value="Velvet">Velvet</option>
    <option value="Sheer Fabric">Sheer Fabric</option>
</select>

<input id="max_price"
       type="number"
       placeholder="Maximum Price (₹)">

        <button onclick="getRecommendations()">
            ✨ Get Recommendations
        </button>
        <button type="button" class="reset-button" onclick="resetFilters()">
    🔄 Reset Filters
</button>

    </div>

    <h2 class="results-title">✨ Recommended for You</h2>

<div id="results"></div>

</div>

<script>

async function getRecommendations() {

    document.getElementById("results").innerHTML =
        "<p style='text-align:center;'>✨ Finding your best outfits...</p>";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/recommend",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    gender: document.getElementById("gender").value,
                    color: document.getElementById("color").value,
                    occasion: document.getElementById("occasion").value,
                    season: document.getElementById("season").value,
                    fit_type: document.getElementById("fit_type").value,
                    fabric: document.getElementById("fabric").value,
                    max_price:
    document.getElementById("max_price").value
        ? Number(document.getElementById("max_price").value)
        : null,
                    n: 5
                })
            }
        );

        const data = await response.json();

        if (!data || data.length === 0) {
            document.getElementById("results").innerHTML =
                "<p style='text-align:center;'>😔 No matching outfits found.</p>";
            return;
        }

        document.getElementById("results").innerHTML =
            data.map(item => {

                let imageUrl = item["Image URL-src"];

                if (imageUrl && imageUrl.includes("(")) {
                    imageUrl = imageUrl.split("(")[1].split(")")[0];
                }

                let productUrl = item["Products-href"];

                if (productUrl && productUrl.includes("(")) {
                    productUrl = productUrl.split("(")[1].split(")")[0];
                }

                return `
                    <div class="card">

                        <img
                            src="${imageUrl}"
                            alt="${item.product_name}"
                            class="product-image"
                        >

                        <h3>
                            ${item.product_name}
                        </h3>

                        <p>🎨 ${item.color}</p>

                        <p>🎉 ${item.occasion}</p>

                        <p>☀️ ${item.season}</p>

                        <p class="price">
                            ₹ ${item.price_pkr}
                        </p>

                        <p class="match">
                            ⭐ Match:
                            ${(item.similarity_score * 100).toFixed(0)}%
                        </p>

                        <a
                            href="${productUrl}"
                            target="_blank"
                            class="product-button"
                        >
                            View Product →
                        </a>

                    </div>
                `;

            }).join("");

    } catch (error) {

        document.getElementById("results").innerHTML =
            "<p style='text-align:center; color:red;'>❌ Something went wrong. Please try again.</p>";

        console.error(error);
    }
}
function resetFilters() {
    document.getElementById("gender").value = "";
    document.getElementById("color").value = "";
    document.getElementById("occasion").value = "";
    document.getElementById("season").value = "";
    document.getElementById("fit_type").value = "";
    document.getElementById("fabric").value = "";
    document.getElementById("max_price").value = "";

    document.getElementById("results").innerHTML = "";
}

</script>
</body>
</html>
